<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>probe</title>
<style>body{margin:0;background:#111;color:#ddd;font:12px monospace}
iframe{border:0}pre{padding:10px;background:#000;color:#0f0;white-space:pre-wrap}</style></head>
<body>
<iframe id="f" src="/index.html" width="1500" height="950"></iframe>
<pre id="r">running…</pre>
<script>
var f = document.getElementById("f");
f.addEventListener("load", function () {
  var L = [], errs = [];
  var w = f.contentWindow, d = f.contentDocument;
  w.addEventListener("error", function (e) { errs.push(e.message); });
  window.setTimeout(function () {
    function q(s) { return d.querySelector(s); }
    function qa(s) { return d.querySelectorAll(s); }

    L.push("=== 结构 ===");
    L.push("tabs=" + qa(".tab").length + " treeDir=" + qa(".fileitem[aria-expanded]").length +
      " treeFile=" + qa(".fileitem[role=treeitem]").length);
    L.push("events=" + qa(".ev").length + " gates=" + qa(".gate").length +
      " steps=" + qa(".pstep").length + " diffLines=" + qa(".dline").length);
    L.push("copyBtns=" + qa(".copybtn").length + " chips=" + qa(".chip").length +
      " boot=" + (q("#boot").hidden ? "已隐藏" : "显示中"));
    L.push("streamStat=" + q("#stream-stat").textContent);
    L.push("bootTxt=" + q("#boot-txt").textContent);

    L.push("");
    L.push("=== 命令面板 ===");
    q("#btn-cmdk").click();
    L.push("打开=" + !q(".paletteback")?.hidden + " 项数=" + qa(".palette__item").length +
      " 分组=" + qa(".palette__group").length);
    var inp = q(".palette__input");
    inp.value = "reconnect";
    inp.dispatchEvent(new w.Event("input", { bubbles: true }));
    L.push("搜 'reconnect' → " + qa(".palette__item").length + " 项，首项=" +
      (qa(".palette__label")[0] ? qa(".palette__label")[0].textContent : "无"));
    inp.value = "zzzz";
    inp.dispatchEvent(new w.Event("input", { bubbles: true }));
    L.push("搜 'zzzz' → 空状态=" + !!q(".palette__empty"));
    inp.value = "";
    inp.dispatchEvent(new w.Event("input", { bubbles: true }));
    L.push("清空后恢复=" + qa(".palette__item").length);
    // Esc 关闭
    inp.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    L.push("Esc 关闭=" + !q(".paletteback"));

    L.push("");
    L.push("=== Toast ===");
    w.UI.toast({ tone: "ok", title: "测试通知", duration: 100000 });
    L.push("toast 数=" + qa(".toast").length + " 进度条=" + qa(".toast__bar").length);
    w.UI.toast({ tone: "warn", title: "带撤销", duration: 100000,
      actions: [{ label: "撤销", primary: true, onClick: function () { w.__undo = true; } }] });
    L.push("带操作 toast=" + qa(".toast__actions, .toast__acts").length);
    qa(".toast__act")[0].click();
    L.push("点撤销后回调=" + (w.__undo === true));
    L.push("关闭后剩余=" + qa(".toast").length);

    L.push("");
    L.push("=== 确认框（脏标签关闭）===");
    var dirtyTab = qa(".tab__dirty")[0];
    var tabBtn = dirtyTab ? dirtyTab.closest(".tab") : null;
    L.push("脏标签存在=" + !!tabBtn);
    if (tabBtn) {
      tabBtn.click();
      var cb = dirtyTab.closest(".tab").querySelector(".tab__close");
      cb.click();
      L.push("弹确认框=" + !!q(".modal") + " 标题=" + (q(".modal__title") ? q(".modal__title").textContent : ""));
      L.push("焦点在确认按钮=" + (document.activeElement && q(".modal") && q(".modal").contains(d.activeElement)));
      // 取消
      qa(".modal__acts .btn")[0].click();
      var before = qa(".tab").length;
      L.push("取消后标签数=" + before + " 弹框已关=" + !q(".modal"));
    }

    L.push("");
    L.push("=== 右键菜单（标签）===");
    var t0 = qa(".tab")[0];
    t0.dispatchEvent(new w.MouseEvent("contextmenu", { bubbles: true, clientX: 200, clientY: 60 }));
    L.push("菜单项=" + qa(".ctxmenu__item").length + " 分隔=" + qa(".ctxmenu__sep").length);
    document.dispatchEvent(new w.MouseEvent("mousedown", { bubbles: true }));
    // 菜单在 iframe 内，需在 iframe 文档上派发
    d.dispatchEvent(new w.MouseEvent("mousedown", { bubbles: true }));
    L.push("点外部后关闭=" + !q(".ctxmenu"));

    L.push("");
    L.push("=== 文件树键盘 ===");
    var items = qa(".fileitem[role=treeitem]");
    L.push("文件项=" + items.length);
    if (items.length) {
      items[0].focus();
      L.push("聚焦首项=" + (d.activeElement === items[0]));
      items[0].dispatchEvent(new w.KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true }));
      L.push("↓ 后焦点=" + (d.activeElement.querySelector(".fileitem__name") ?
        d.activeElement.querySelector(".fileitem__name").textContent : "?"));
    }

    L.push("");
    L.push("=== 事件过滤 ===");
    q("#btn-filter-tools").click();
    L.push("仅工具 → 可见=" + [].filter.call(qa(".ev"), function (n) {
      return n.getAttribute("data-hidden") !== "true"; }).length + " 统计=" + q("#stream-stat").textContent);
    q("#btn-filter-all").click();
    L.push("回全部 → 可见=" + [].filter.call(qa(".ev"), function (n) {
      return n.getAttribute("data-hidden") !== "true"; }).length);

    L.push("");
    L.push("=== 终端 ===");
    var ti = q("#term-input");
    var beforeLines = qa("#terminal-body span").length;
    ti.value = "ls";
    ti.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    q("#termform").dispatchEvent(new w.Event("submit", { bubbles: true, cancelable: true }));
    L.push("执行 ls 后行数 " + beforeLines + " → " + qa("#terminal-body span").length);
    ti.value = ""
    ti.focus();
    ti.dispatchEvent(new w.KeyboardEvent("keydown", { key: "ArrowUp", bubbles: true }));
    L.push("↑ 历史回填=" + JSON.stringify(ti.value));

    L.push("");
    L.push("=== 上下文浮层 ===");
    q("#btn-dock-ctx").click();
    L.push("浮层=" + !q("#ctxpop").hidden + " 项=" + qa(".ctxpop__item").length);
    qa(".ctxpop__item")[0].click();
    L.push("chip=" + qa(".ctxref").length);

    L.push("");
    L.push("=== @ 补全 ===");
    var ta = q("#dock-input");
    ta.focus();
    ta.value = "@recon";
    ta.setSelectionRange(6, 6);
    ta.dispatchEvent(new w.Event("input", { bubbles: true }));
    L.push("补全浮层=" + !q("#mention").hidden + " 项=" + qa(".mention__item").length +
      " 首项=" + (qa(".mention__name")[0] ? qa(".mention__name")[0].textContent : "无"));
    ta.value = "/";
    ta.setSelectionRange(1, 1);
    ta.dispatchEvent(new w.Event("input", { bubbles: true }));
    L.push("斜杠命令浮层=" + !q("#mention").hidden + " 项=" + qa(".mention__item").length);
    ta.value = "";
    ta.dispatchEvent(new w.Event("input", { bubbles: true }));

    L.push("");
    L.push("=== 快捷键总览 ===");
    q("#btn-help").click();
    L.push("打开=" + !!q(".sheet") + " 分组=" + qa(".sheet__group").length +
      " 行=" + qa(".sheet__row").length);
    q(".sheet__head .iconbtn").click();
    L.push("关闭=" + !q(".sheet"));

    L.push("");
    L.push("=== localStorage 持久化 ===");
    try {
      var raw = w.localStorage.getItem("crucible.ui.v1");
      L.push("已写入=" + (raw ? raw.slice(0, 90) : "无"));
    } catch (e) { L.push("localStorage 不可用：" + e.message); }

    L.push("");
    L.push("JS 错误=" + errs.length + (errs.length ? " :: " + errs.join(" | ") : ""));
    document.getElementById("r").textContent = L.join("\n");
  }, 1400);
});
</script>
</body></html>
