<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>probe2</title>
<style>body{margin:0;background:#111;color:#ddd;font:12px monospace}
iframe{border:0}pre{padding:10px;background:#000;color:#0f0;white-space:pre-wrap}</style></head>
<body>
<iframe id="f" src="/index.html" width="1500" height="950"></iframe>
<pre id="r">running…</pre>
<script>
var f = document.getElementById("f");
f.addEventListener("load", function () {
  var L = [], errs = [];
  var w = f.contentWindow, d = f.contentDocument;
  // 抑制首次欢迎提示，避免干扰读数（模拟「老用户」）
  try { w.localStorage.setItem("crucible.seen.v1", "1"); } catch (e) {}
  w.addEventListener("error", function (e) { errs.push(e.message); });

  function q(s) { return d.querySelector(s); }
  function qa(s) { return d.querySelectorAll(s); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function active() { return d.activeElement; }

  window.setTimeout(function () {
    (async function () {

      L.push("=== Toast 撤销链路 ===");
      w.UI.toast({ tone: "warn", title: "已删除 x.ts", duration: 200000,
        actions: [{ label: "撤销", primary: true, onClick: function () { w.__undo = true; } }] });
      var n0 = qa(".toast").length;
      L.push("toast 数=" + n0 + " 操作按钮=" + qa(".toast__act").length);
      qa(".toast__act")[0].click();
      await sleep(500);
      L.push("点撤销 → 回调触发=" + (w.__undo === true) + " · 关闭后剩余=" + qa(".toast").length);

      L.push("");
      L.push("=== 确认框焦点管理 ===");
      var dt = qa(".tab__dirty")[0];
      L.push("脏标签=" + !!dt);
      dt.closest(".tab").querySelector(".tab__close").click();
      await sleep(120);
      L.push("弹框=" + !!q(".modal") + " · 标题=" + (q(".modal__title") || {}).textContent);
      L.push("焦点落在确认按钮=" + (active() === qa(".modal__acts .btn")[1]));
      L.push("Tab 陷阱生效（role）=" + q(".modal").getAttribute("role") + " aria-modal=" + q(".modal").getAttribute("aria-modal"));
      var tabsBefore = qa(".tab").length;
      qa(".modal__acts .btn")[0].click();   // 取消
      await sleep(400);
      L.push("取消 → 弹框已移除=" + !q(".modal") + " · 标签未变=" + (qa(".tab").length === tabsBefore));

      L.push("");
      L.push("=== 确认框 → 确认删除路径 ===");
      dt.closest(".tab").querySelector(".tab__close").click();
      await sleep(120);
      qa(".modal__acts .btn")[1].click();   // 放弃并关闭
      await sleep(400);
      L.push("确认 → 弹框移除=" + !q(".modal") + " · 标签 " + tabsBefore + " → " + qa(".tab").length);
      L.push("焦点已归还到 body 或触发处=" + (active() && active().tagName));

      L.push("");
      L.push("=== 右键菜单关闭路径 ===");
      var t0 = qa(".tab")[0];
      t0.dispatchEvent(new w.MouseEvent("contextmenu", { bubbles: true, clientX: 220, clientY: 60 }));
      await sleep(60);
      L.push("菜单打开=" + !!q(".ctxmenu") + " 项=" + qa(".ctxmenu__item").length);
      L.push("首项已获焦=" + (active() === qa(".ctxmenu__item:not([disabled])")[0]));
      d.body.dispatchEvent(new w.MouseEvent("mousedown", { bubbles: true }));
      await sleep(60);
      L.push("点外部 → 关闭=" + !q(".ctxmenu"));
      // 键盘路径
      t0.dispatchEvent(new w.MouseEvent("contextmenu", { bubbles: true, clientX: 220, clientY: 60 }));
      await sleep(60);
      active().dispatchEvent(new w.KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true }));
      L.push("↓ 移动焦点=" + (active() === qa(".ctxmenu__item:not([disabled])")[1]));
      active().dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      await sleep(60);
      L.push("Esc → 关闭=" + !q(".ctxmenu"));

      L.push("");
      L.push("=== 快捷键总览（唯一实例）===");
      q("#btn-help").click();
      await sleep(80);
      L.push("sheet 数=" + qa(".sheet").length + " · 分组=" + qa(".sheet__group").length + " · 行=" + qa(".sheet__row").length);
      q(".sheet__head .iconbtn").click();
      await sleep(80);
      L.push("点关闭 → sheet 数=" + qa(".sheet").length);
      q("#btn-help").click();
      await sleep(80);
      d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      await sleep(80);
      L.push("Esc → sheet 数=" + qa(".sheet").length);

      L.push("");
      L.push("=== 主题持久化 ===");
      L.push("初始 theme=" + d.documentElement.getAttribute("data-theme"));
      q("#btn-theme").click();
      await sleep(60);
      L.push("切换后=" + d.documentElement.getAttribute("data-theme") +
        " · 已存=" + (JSON.parse(w.localStorage.getItem("crucible.ui.v1") || "{}").theme || "无"));
      q("#btn-theme").click();
      await sleep(60);

      L.push("");
      L.push("=== 侧栏宽度拖拽 ===");
      var w0 = d.querySelector(".rail").getBoundingClientRect().width;
      var rh = q("#rail-resize");
      rh.dispatchEvent(new w.PointerEvent("pointerdown", { bubbles: true, clientX: 300, clientY: 300, pointerId: 1 }));
      rh.dispatchEvent(new w.PointerEvent("pointermove", { bubbles: true, clientX: 380, clientY: 300, pointerId: 1 }));
      rh.dispatchEvent(new w.PointerEvent("pointerup", { bubbles: true, clientX: 380, clientY: 300, pointerId: 1 }));
      await sleep(80);
      var w1 = d.querySelector(".rail").getBoundingClientRect().width;
      L.push("宽度 " + Math.round(w0) + " → " + Math.round(w1) + " (期望 +80)");
      L.push("已存 railW=" + (JSON.parse(w.localStorage.getItem("crucible.ui.v1") || "{}").railW || "无"));
      rh.dispatchEvent(new w.MouseEvent("dblclick", { bubbles: true }));
      await sleep(80);
      L.push("双击复位 → 宽度=" + Math.round(d.querySelector(".rail").getBoundingClientRect().width));

      L.push("");
      L.push("=== 面板/终端状态持久化 ===");
      q("#btn-agent-toggle").click();
      await sleep(40);
      L.push("收起面板 → shell class=" + (d.querySelector(".shell").className || "-") +
        " · 已存 agentHidden=" + (JSON.parse(w.localStorage.getItem("crucible.ui.v1") || "{}").agentHidden));
      q("#btn-agent-toggle").click();
      var tb = q("#btn-term-toggle");
      tb.click();
      await sleep(60);
      L.push("折叠终端 → workbench class=" + d.querySelector(".workbench").className);
      L.push("终端可见性=" + w.getComputedStyle(q(".terminal")).visibility);
      tb.click();

      L.push("");
      L.push("=== 标签中键关闭 ===");
      var n1 = qa(".tab").length;
      qa(".tab")[1].dispatchEvent(new w.MouseEvent("auxclick", { bubbles: true, button: 1 }));
      await sleep(80);
      L.push("中键 → 标签 " + n1 + " → " + qa(".tab").length);

      L.push("");
      L.push("=== 标签溢出提示 ===");
      L.push("tabbar scrollW=" + q(".tabbar__scroll").scrollWidth + " clientW=" + q(".tabbar__scroll").clientWidth);
      L.push("overflow-right=" + q(".tabbar").getAttribute("data-overflow-right") +
        " · more 按钮=" + (q("#tabbar-more").hidden ? "隐藏" : "显示") +
        " · 计数=" + (q("#tabbar-count").hidden ? "隐藏" : q("#tabbar-count").textContent));

      L.push("");
      L.push("=== 行号一致性（回归）===");
      var g = q("#editor-gutter").textContent.trim().split("\n");
      var c = q("#editor-code").textContent.split("\n");
      L.push("gutter=" + g.length + " code=" + c.length + " 一致=" + (g.length === c.length));

      L.push("");
      L.push("JS 错误=" + errs.length + (errs.length ? " :: " + errs.join(" | ") : ""));
      document.getElementById("r").textContent = L.join("\n");
    })();
  }, 1200);
});
</script>
</body></html>
