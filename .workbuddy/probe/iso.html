<!DOCTYPE html><html><head><meta charset="UTF-8"><title>iso</title>
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/app.css">
<style>body{margin:0;background:#111;color:#0f0;font:12px monospace}pre{padding:10px}</style>
</head><body>
<div class="workbench" id="wb" style="height:400px">
  <div>editor</div>
  <div class="splithandle"></div>
  <section class="terminal" id="term">term</section>
</div>
<pre id="out"></pre>
<script>
var wb=document.getElementById("wb"), term=document.getElementById("term");
var L=[];
L.push("初始 rows="+getComputedStyle(wb).gridTemplateRows+" termH="+term.getBoundingClientRect().height+" vis="+getComputedStyle(term).visibility);
wb.classList.add("is-term-collapsed");
void wb.offsetHeight;
L.push("折叠 rows="+getComputedStyle(wb).gridTemplateRows+" termH="+term.getBoundingClientRect().height+" vis="+getComputedStyle(term).visibility);
wb.classList.remove("is-term-collapsed");
void wb.offsetHeight;
L.push("展开 rows="+getComputedStyle(wb).gridTemplateRows+" termH="+term.getBoundingClientRect().height+" vis="+getComputedStyle(term).visibility);
document.getElementById("out").textContent=L.join("\n");
</script></body></html>
