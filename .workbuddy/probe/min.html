<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/app.css">
<style>body{margin:0;background:#111;color:#0f0;font:12px monospace;white-space:pre-wrap}</style>
</head><body>
<div class="workbench" id="wb" style="height:400px">
  <div>e</div><div class="splithandle"></div>
  <section class="terminal" id="term">t</section>
</div>
<pre id="out"></pre>
<script>
var wb=document.getElementById("wb"), term=document.getElementById("term");
var L=[];
L.push("wb.matches('.workbench.is-term-collapsed') 前 = " + wb.matches(".workbench.is-term-collapsed"));
wb.classList.add("is-term-collapsed");
L.push("classList = " + wb.className);
L.push("wb.matches('.workbench.is-term-collapsed') 后 = " + wb.matches(".workbench.is-term-collapsed"));
L.push("rows = " + getComputedStyle(wb).gridTemplateRows);
L.push("term.matches = " + term.matches(".workbench.is-term-collapsed .terminal"));
L.push("term vis = " + getComputedStyle(term).visibility);

// 直接注入同样内容的一条规则，用最高优先级
var st=document.createElement("style");
st.textContent=".workbench.is-term-collapsed{grid-template-rows:minmax(0,1fr) auto 0 !important}.workbench.is-term-collapsed .terminal{visibility:hidden !important}";
document.head.appendChild(st);
L.push("注入 !important 后 rows = " + getComputedStyle(wb).gridTemplateRows);
L.push("注入 !important 后 vis = " + getComputedStyle(term).visibility);

document.getElementById("out").textContent=L.join("\n");
</script></body></html>
