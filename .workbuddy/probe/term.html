<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>term probe</title>
<style>body{margin:0;background:#111;color:#ddd;font:12px monospace}iframe{border:0}pre{padding:10px;background:#000;color:#0f0;white-space:pre-wrap}</style></head>
<body>
<iframe id="f" src="/index.html" width="1500" height="950"></iframe>
<pre id="r">running…</pre>
<script>
document.getElementById("f").addEventListener("load", function () {
  var w = this.contentWindow, d = this.contentDocument;
  setTimeout(function () {
    var L = [];
    var wb = d.querySelector(".workbench");
    var term = d.querySelector(".terminal");
    L.push("terminal 是 workbench 的后代? " + wb.contains(term));
    L.push("折叠前: class=" + wb.className + " vis=" + w.getComputedStyle(term).visibility +
      " h=" + Math.round(term.getBoundingClientRect().height));

    wb.classList.add("is-term-collapsed");
    L.push("加类后（未走JS）: class=" + wb.className + " vis=" + w.getComputedStyle(term).visibility +
      " h=" + Math.round(term.getBoundingClientRect().height));
    L.push("gridTemplateRows=" + w.getComputedStyle(wb).gridTemplateRows);

    // 走 JS 路径
    wb.classList.remove("is-term-collapsed");
    d.querySelector("#btn-term-toggle").click();
    L.push("点按钮后: class=" + wb.className + " vis=" + w.getComputedStyle(term).visibility +
      " h=" + Math.round(term.getBoundingClientRect().height));
    L.push("btn aria-expanded=" + d.querySelector("#btn-term-toggle").getAttribute("aria-expanded"));

    // 检查 CSS 是否真的存在该规则
    var found = null;
    for (var i = 0; i < d.styleSheets.length; i++) {
      try {
        var rules = d.styleSheets[i].cssRules;
        for (var j = 0; j < rules.length; j++) {
          var t = rules[j].selectorText || "";
          if (t && t.indexOf("is-term-collapsed") > -1 && t.indexOf(".terminal") > -1) {
            found = (found || "") + t + " { " + rules[j].style.cssText + " } | ";
          }
        }
      } catch (e) { L.push("读样式表 " + i + " 失败: " + e.message); }
    }
    L.push("命中的 CSS 规则: " + (found || "未找到"));
    document.getElementById("r").textContent = L.join("\n");
  }, 1200);
});
</script>
</body></html>
