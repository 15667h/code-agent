<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>宽度扫描</title>
<style>
  body { margin:0; background:#111; color:#ddd; font:12px monospace; }
  .row { display:flex; gap:8px; align-items:flex-start; padding:8px; border-bottom:1px solid #333; }
  .lbl { flex:none; width:70px; color:#0f0; padding-top:4px; }
  iframe { border:0; display:block; background:#000; }
  pre { margin:0; padding:6px; background:#000; color:#0f0; white-space:pre-wrap; width:520px; font-size:11px; }
</style></head>
<body>
<div id="host"></div>
<pre id="sum">running…</pre>
<script>
/* 用固定宽度 iframe 包一层，是测窄屏唯一可靠的做法
   （headless Chrome 有最小窗口宽度限制，直接改 window-size 测不准）。 */
var WIDTHS = [1600, 1440, 1280, 1100, 1024, 900, 860, 768, 700, 480, 375, 320];
var host = document.getElementById("host");
var pending = WIDTHS.length;
var lines = [];

WIDTHS.forEach(function (w) {
  var row = document.createElement("div");
  row.className = "row";
  var lb = document.createElement("div");
  lb.className = "lbl";
  lb.textContent = w + "px";
  row.appendChild(lb);
  var f = document.createElement("iframe");
  f.width = w;
  f.height = 640;
  f.src = "/.workbuddy/probe/widthpage.html?w=" + w;
  row.appendChild(f);
  var rep = document.createElement("pre");
  rep.setAttribute("data-w", w);
  row.appendChild(rep);
  host.appendChild(row);

  f.addEventListener("load", function () {
    setTimeout(function () {
      try {
        var d = f.contentDocument;
        var g = d.getElementById("__geo");
        rep.textContent = g ? g.textContent : "（探针未运行）";
        lines.push(w + "px  " + rep.textContent);
      } catch (e) {
        rep.textContent = "读取失败: " + e.message;
        lines.push(w + "px  读取失败 " + e.message);
      }
      pending--;
      if (pending === 0) document.getElementById("sum").textContent = lines.join("\n");
    }, 900);
  });
});
</script>
</body></html>
